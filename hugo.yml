baseURL: "https://visionjam.github.io/"
title: "VisionJam"
locale: "zh-cn"
defaultContentLanguage: "zh"
theme: ["PaperMod"]

enableRobotsTXT: true
enableGitInfo: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true

services:
  rss:
    limit: 20

pagination:
  pagerSize: 10

taxonomies:
  tag: tags

menu:
  main:
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 10
    - identifier: ranking
      name: 排行
      url: /ranking/
      weight: 15
      params:
        group: more
    - identifier: stats
      name: 统计
      url: /stats/
      weight: 17
      params:
        group: more
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 20
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 30
    - identifier: search
      name: 搜索
      url: /search/
      weight: 40
    - identifier: about
      name: 关于
      url: /about/
      weight: 50
      params:
        group: more

params:
  env: production
  description: "VisionJam 的个人博客，记录思考、技术与生活。"
  author: "VisionJam"
  DateFormat: "2006-01-02"
  mainSections:
    - posts
    - android-guide
  homeLimit: 20
  defaultTheme: auto
  # 阅读时长改由 layouts/_partials/post_meta.html 按中文字符口径计算
  ShowReadingTime: false
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  TocOpen: false
  ShowWordCount: false
  comments: true
  giscus:
    repo: "visionjam/visionjam.github.io"
    repoId: "R_kgDORwkB7A"
    category: "Announcements"
    categoryId: "DIC_kwDORwkB7M4DJVqS"
  homeInfoParams:
    Title: "你好，我是 VisionJam"
    Content: "记录思考、技术与生活。这里会不定期更新文章。"
  socialIcons:
    - name: github
      title: GitHub
      url: "https://github.com/visionjam"
    - name: zhihu
      title: 知乎
      url: "https://www.zhihu.com/people/kong-qi-82-94"
    - name: rss
      title: RSS 订阅
      url: "/index.xml"
  assets:
    disableHLJS: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
